services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acoustic
      POSTGRES_PASSWORD: acoustic
      POSTGRES_DB: ufo_observation_command
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acoustic -d ufo_observation_command"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - acoustic-postgres:/var/lib/postgresql/data

volumes:
  acoustic-postgres:
